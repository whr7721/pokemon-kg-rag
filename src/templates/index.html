<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦知识图谱 RAG</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --accent:#f5b301; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { margin:0; font-size:20px; letter-spacing:0; }
  main { max-width:1100px; margin:24px auto; padding:0 20px; display:grid; gap:20px; }
  .ask { display:flex; gap:10px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  button { background:var(--accent); border:none; color:#1f2933; padding:12px 18px; border-radius:8px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; }
  .panel h2 { margin:0 0 12px; font-size:14px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:8px; }
  #answer { white-space:pre-wrap; line-height:1.7; }
  .evi { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; font-size:14px; }
  .evi .meta { color:var(--muted); font-size:12px; margin-bottom:6px; }
  #graph { height:420px; border:1px solid var(--line); border-radius:8px; background:#fafbfc; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:820px){ .grid{grid-template-columns:1fr;} }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:#fff; border:1px solid var(--line); color:var(--ink); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:400; }
  .chip:hover { border-color:var(--accent); color:#8a6100; }
  .errbar { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:10px 14px; border-radius:8px; font-size:14px; }
  .errbar button { background:none; border:none; color:#b91c1c; font-size:16px; font-weight:700; padding:0 2px; }
  .errbar[hidden] { display:none; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid #d1d5db; border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .legend { display:flex; flex-wrap:wrap; gap:14px; padding:6px 2px 10px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .modes { display:inline-flex; background:#eef0f3; border-radius:8px; padding:3px; gap:3px; }
  .modebtn { background:transparent; border:none; color:var(--muted); padding:8px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
  .modebtn.active { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .pathlabel { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  select { padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink); }
  .badge.path { background:#0f766e; }
  .badge { font-size:11px; font-weight:700; color:#fff; background:#6b7280; border-radius:999px; padding:2px 8px; }
  .badge.graph_rag, .badge.naive_rag { background:#0ea5e9; }
  .badge.evolution, .badge.counter, .badge.ability, .badge.move, .badge.strategy, .badge.suggest, .badge.relation { background:#8b5cf6; }
  .cmp { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:820px){ .cmp{grid-template-columns:1fr;} }
  .cmp .card { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .cmp .card h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:700; }
  .cmp .ans { white-space:pre-wrap; line-height:1.6; }
  #nodedetail { border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; background:#fbfcfe; font-size:13px; display:none; }
  #nodedetail h3 { margin:0 0 8px; font-size:13px; color:var(--ink); }
  #nodedetail .row { display:grid; grid-template-columns:88px 1fr; gap:8px; margin:4px 0; }
  #nodedetail .k { color:var(--muted); }
</style>
</head>
<body>
<header><h1>宝可梦知识图谱 RAG</h1></header>
<main>
  <div id="errbar" class="errbar" hidden>
    <span id="errtext"></span>
    <button id="errclose" title="关闭">✕</button>
  </div>
  <div>
    <div class="ask">
      <input id="q" type="text" placeholder="例如：皮卡丘是什么属性？妙蛙种子最终进化成什么？">
      <button id="go">提问</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">
      <div class="modes">
        <button id="modeGraph" class="modebtn active">GraphRAG</button>
        <button id="modeCompare" class="modebtn">对照模式</button>
      </div>
      <label class="pathlabel">检索路径
        <select id="retrieval">
          <option value="hybrid_graph">混合 + 图扩展（最终方案）</option>
          <option value="hybrid">混合检索（向量 + 全文）</option>
          <option value="vector">仅向量</option>
          <option value="fulltext">仅全文</option>
        </select>
      </label>
    </div>
    <div class="chips" id="chips" style="margin-top:10px;"></div>
  </div>
  <div class="panel">
    <h2>回答 <span id="modebadge" class="badge" hidden></span> <span id="pathbadge" class="badge path" hidden></span></h2>
    <div id="answer">请输入问题，或点击下方示例问题快速体验。</div>
    <div id="compare" class="cmp" hidden></div>
  </div>
  <div class="grid">
    <div class="panel">
      <h2>证据片段 <span id="evtag" class="badge" style="display:none;"></span></h2>
      <div id="evidence"></div>
    </div>
    <div class="panel">
      <h2>知识图谱子图</h2>
      <div class="legend" id="legend"></div>
      <div id="graph"></div>
      <div id="nodedetail">
        <h3 id="ndtitle"></h3>
        <div id="ndfields"></div>
      </div>
    </div>
  </div>
</main>
<script>
const NODE_COLORS = {
  Pokemon:'#f59e0b', Move:'#3b82f6', Ability:'#10b981', Type:'#8b5cf6',
  EggGroup:'#ec4899', RegionDex:'#64748b',
};
const NODE_ZH = {
  Pokemon:'宝可梦', Move:'招式', Ability:'特性', Type:'属性', EggGroup:'蛋群', RegionDex:'地区图鉴',
};
const MODE_ZH = {
  graph_rag:'GraphRAG', naive_rag:'普通 RAG', open:'开放问答', evolution:'进化',
  counter:'克制', ability:'特性', move:'招式', strategy:'策略', suggest:'建议', relation:'关系',
};
const RETRIEVAL_ZH = {
  vector:'仅向量', fulltext:'仅全文', hybrid:'混合检索', hybrid_graph:'混合+图扩展',
};
const net = new vis.Network(document.getElementById('graph'), {nodes:new vis.DataSet(), edges:new vis.DataSet()}, {
  physics:true,
  groups:NODE_COLORS,
  nodes:{shape:'dot', size:22, font:{color:'#1f2933'}},
  edges:{arrows:'to', font:{align:'middle'}}
});
Object.keys(NODE_COLORS).forEach(g=>{
  const s=document.createElement('span');
  s.innerHTML=`<i style="background:${NODE_COLORS[g]}"></i>${NODE_ZH[g]||g}`;
  document.getElementById('legend').appendChild(s);
});
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function drawGraph(sg){
  if(!sg){ net.setData({nodes:new vis.DataSet(), edges:new vis.DataSet()}); return; }
  net.setData({
    nodes: new vis.DataSet((sg.nodes||[]).map(n=>({id:n.id,label:n.label,group:n.group}))),
    edges: new vis.DataSet((sg.edges||[]).map(e=>({from:e.from,to:e.to,label:e.label})))
  });
}
function showError(msg){ document.getElementById('errtext').textContent=msg; document.getElementById('errbar').hidden=false; }
function hideError(){ document.getElementById('errbar').hidden=true; }
document.getElementById('errclose').onclick=hideError;
const EXAMPLES=[
  '皮卡丘是什么属性？',
  '妙蛙种子最终进化成什么？',
  '草+毒属性被什么属性克制？',
  '哪些火属性招式威力大于80？',
  '茂盛特性的效果是什么？',
];
EXAMPLES.forEach(q=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=q;
  b.onclick=()=>{ document.getElementById('q').value=q; ask(); };
  document.getElementById('chips').appendChild(b);
});
let view='graph';
const modeGraph=document.getElementById('modeGraph'), modeCompare=document.getElementById('modeCompare');
function setView(v){
  view=v;
  modeGraph.classList.toggle('active', v==='graph');
  modeCompare.classList.toggle('active', v==='compare');
}
modeGraph.onclick=()=>setView('graph');
modeCompare.onclick=()=>setView('compare');
function setBadge(mode){
  const b=document.getElementById('modebadge');
  const zh=MODE_ZH[mode]||mode;
  if(zh){ b.textContent=zh; b.className='badge '+mode; b.hidden=false; }
  else { b.hidden=true; }
}
function setPathBadge(mode){
  const b=document.getElementById('pathbadge');
  const zh=RETRIEVAL_ZH[mode];
  if(zh){ b.textContent='检索：'+zh; b.hidden=false; }
  else { b.hidden=true; }
}
function renderEvidence(list){
  const ev=document.getElementById('evidence'); ev.innerHTML='';
  (list||[]).forEach(e=>{
    const d=document.createElement('div'); d.className='evi';
    const md=e.metadata||{};
    d.innerHTML=`<div class="meta">${escapeHtml(md.entity_label)} · ${escapeHtml(md.entity_name)} · score ${(md.score||0).toFixed(3)}</div><div>${escapeHtml(e.text)}</div>`;
    ev.appendChild(d);
  });
}
function renderCompare(data){
  const c=document.getElementById('compare'); c.hidden=false; c.innerHTML='';
  const answer=document.getElementById('answer'); answer.hidden=true;
  [['naive','普通 RAG'],['graph','GraphRAG']].forEach(([key,title])=>{
    const item=data[key]||{};
    const card=document.createElement('div'); card.className='card';
    const h=document.createElement('h3');
    h.textContent=`${title} · 证据 ${(item.evidence||[]).length} 条 · 图谱事实 ${(item.facts||[]).length} 条`;
    const a=document.createElement('div'); a.className='ans'; a.textContent=item.answer||'无回答';
    card.appendChild(h); card.appendChild(a); c.appendChild(card);
  });
}
function renderNodeDetail(detail){
  const box=document.getElementById('nodedetail');
  if(!detail){ box.style.display='none'; return; }
  document.getElementById('ndtitle').textContent=`${NODE_ZH[detail.label]||detail.label} · ${detail.name||''}`;
  const fields=document.getElementById('ndfields'); fields.innerHTML='';
  (detail.fields||[]).forEach(f=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div class="k">${escapeHtml(f.k)}</div><div>${escapeHtml(f.v==null?'':String(f.v))}</div>`;
    fields.appendChild(row);
  });
  box.style.display='block';
}
let busy=false;
async function ask(){
  if(busy) return;
  const q=document.getElementById('q').value.trim();
  const rmode=document.getElementById('retrieval').value;
  if(!q) return;
  busy=true;
  const btn=document.getElementById('go'), ans=document.getElementById('answer'), cmp=document.getElementById('compare');
  btn.disabled=true; btn.textContent='查询中…';
  hideError();
  ans.hidden=false; cmp.hidden=true;
  ans.innerHTML='<span class="spin"></span>正在检索知识图谱并生成回答，约需数秒…';
  document.getElementById('evidence').innerHTML='';
  document.getElementById('evtag').style.display='none';
  document.getElementById('nodedetail').style.display='none';
  drawGraph(null);
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(), 120000);
  try{
    let url, body;
    if(view==='compare'){
      url='/api/compare'; body={question:q, retrieval_mode:rmode};
    } else {
      url='/api/ask'; body={question:q, use_graph:true, retrieval_mode:rmode};
    }
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    if(!res.ok) throw new Error('服务返回 '+res.status);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    if(view==='compare'){
      ans.hidden=true;
      document.getElementById('modebadge').hidden=true;
      setPathBadge(data.retrieval_mode);
      renderCompare(data);
      const g=data.graph||{};
      renderEvidence(g.evidence||[]);
      const tag=document.getElementById('evtag'); tag.textContent=(RETRIEVAL_ZH[data.retrieval_mode]||'')+' GraphRAG 证据'; tag.style.display='inline-block';
      drawGraph(g.subgraph);
    } else {
      cmp.hidden=true;
      ans.textContent=data.answer||'无回答';
      setBadge(data.mode||'graph_rag');
      setPathBadge(data.retrieval_mode);
      renderEvidence(data.evidence||[]);
      drawGraph(data.subgraph);
    }
  }catch(err){
    showError(err.name==='AbortError'
      ? '请求超时（120 秒）：检索或生成耗时过长，请稍后重试。'
      : '请求失败：'+(err.message||'网络错误')+'。请检查后端服务是否已启动，然后重试。');
    ans.textContent='本次未能获取回答，请重试。';
  }finally{
    clearTimeout(timer);
    busy=false; btn.disabled=false; btn.textContent='提问';
  }
}
document.getElementById('go').onclick=ask;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
net.on('click', async function(params){
  if(!params.nodes || params.nodes.length===0) return;
  const id=params.nodes[0];
  const node=net.body.data.nodes.get(id);
  if(!node) return;
  renderNodeDetail(null);
  try{
    const res=await fetch(`/api/entity?label=${encodeURIComponent(node.group||'')}&name=${encodeURIComponent(node.label||'')}`);
    if(!res.ok) throw new Error('实体详情请求失败');
    const detail=await res.json();
    renderNodeDetail(detail.error?null:detail);
  }catch(e){ showError('获取节点详情失败：'+(e.message||'')); }
});
</script>
</body>
</html>
